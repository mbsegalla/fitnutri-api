services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fitnutri
      POSTGRES_USER: fitnutri
      POSTGRES_PASSWORD: fitnutri_local
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fitnutri -d fitnutri']
      interval: 2s
      timeout: 3s
      retries: 20

  livekit:
    image: livekit/livekit-server:v1.13.11
    profiles: ['video']
    command:
      [
        '--config-body',
        'rtc: {port_range_start: 7890, port_range_end: 7900, tcp_port: 7881, use_external_ip: false}',
        '--node-ip',
        '127.0.0.1',
      ]
    environment:
      LIVEKIT_KEYS: '${LIVEKIT_API_KEY:-fitnutri-local}: ${LIVEKIT_API_SECRET:-}'
    ports:
      - '127.0.0.1:7880:7880'
      - '127.0.0.1:7881:7881'
      - '127.0.0.1:7890-7900:7890-7900/udp'

  db-test:
    image: postgres:17-alpine
    profiles: ['test']
    environment:
      POSTGRES_DB: fitnutri_test
      POSTGRES_USER: fitnutri
      POSTGRES_PASSWORD: fitnutri_test
    ports:
      - '127.0.0.1:5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fitnutri -d fitnutri_test']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
